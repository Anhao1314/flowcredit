<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="960" height="540" rx="14" fill="#FFFFFF"/>
  <text x="40" y="42" font-size="20" font-weight="800" fill="#0F172A">Evidence → Risk → Action</text>
  <text x="312" y="42" font-size="15" fill="#94A3B8">deterministic engine owns every authoritative score</text>

  <!-- main pipeline -->
  <g>
    <rect x="250" y="66" width="380" height="56" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.6"/>
    <text x="440" y="92" text-anchor="middle" font-size="16" font-weight="600" fill="#334155">Structured intake + consent-gated text</text>
    <text x="440" y="112" text-anchor="middle" font-size="13" fill="#64748B">normalize fields · provenance · recency</text>
    <path d="M440 122 L440 142" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#ar)"/>

    <rect x="250" y="146" width="380" height="54" rx="10" fill="#FFFFFF" stroke="#15803D" stroke-width="1.8"/>
    <text x="440" y="179" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">Validate &amp; normalize</text>
    <path d="M440 200 L440 220" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#ar)"/>

    <rect x="250" y="224" width="380" height="54" rx="10" fill="#FFFFFF" stroke="#15803D" stroke-width="1.8"/>
    <text x="440" y="250" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">Readiness &amp; evidence coverage</text>
    <text x="440" y="270" text-anchor="middle" font-size="12.5" fill="#64748B">missing / inconsistent fields surfaced</text>
    <path d="M440 278 L440 298" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#ar)"/>

    <rect x="250" y="302" width="380" height="74" rx="10" fill="#15803D"/>
    <text x="440" y="330" text-anchor="middle" font-size="17" font-weight="800" fill="#FFFFFF">Deterministic risk engine v0.2.1</text>
    <text x="440" y="352" text-anchor="middle" font-size="13" fill="#DCFCE7">TAI / CCI scoring (5 + 5 components)</text>
    <text x="440" y="370" text-anchor="middle" font-size="13" fill="#DCFCE7">confirmed-event integrity veto</text>

    <path d="M440 376 L440 396" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#ar)"/>
    <rect x="250" y="400" width="380" height="54" rx="10" fill="#FFFFFF" stroke="#15803D" stroke-width="1.8"/>
    <text x="440" y="433" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">Output &amp; contract validation</text>
    <path d="M440 454 L440 474" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#ar)"/>
    <rect x="250" y="478" width="380" height="48" rx="10" fill="#0F172A"/>
    <text x="440" y="508" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">API v1 → grade, review status &amp; actions</text>
  </g>

  <!-- LLM sidecar -->
  <rect x="688" y="146" width="232" height="120" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="804" y="176" text-anchor="middle" font-size="15.5" font-weight="800" fill="#92400E">LLM sidecar (optional)</text>
  <text x="804" y="200" text-anchor="middle" font-size="13" fill="#92400E">consent-gated extraction</text>
  <text x="804" y="222" text-anchor="middle" font-size="13" fill="#92400E">grounded explanation</text>
  <text x="804" y="248" text-anchor="middle" font-size="12.5" font-weight="700" fill="#B91C1C">cannot overwrite scores</text>

  <!-- sidecar arrows: extraction feeds normalize only -->
  <path d="M688 173 L634 173" stroke="#D97706" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ara)"/>
  <!-- explanation reads from engine -->
  <path d="M630 339 C660 339 662 250 688 232" stroke="#D97706" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#ara)"/>

  <!-- left annotation: no automatic approval -->
  <rect x="40" y="302" width="180" height="74" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.4"/>
  <text x="130" y="330" text-anchor="middle" font-size="13.5" font-weight="700" fill="#475569">No automatic</text>
  <text x="130" y="350" text-anchor="middle" font-size="13.5" font-weight="700" fill="#475569">loan approval;</text>
  <text x="130" y="370" text-anchor="middle" font-size="13.5" fill="#64748B">human / agent decides</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M1,1 L7,4.5 L1,8" stroke="#94A3B8" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ara" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M1,1 L7,4.5 L1,8" stroke="#D97706" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
</svg>
